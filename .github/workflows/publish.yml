name: Publish release to Azure DevOps Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment's protection rules (e.g. required reviewers) gate every Marketplace publish.
    # Store PUBLISH_TOKEN (a Marketplace personal access token) as an environment secret so only this job can read it.
    environment:
      name: Visual Studio Marketplace
      url: https://marketplace.visualstudio.com/items?itemName=jeremy-morren.authenticatedscripts
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
          install-tfx: 'true'

      - name: Download the published release VSIX
        run: gh release download "$RELEASE_TAG" --pattern "authenticated-scripts-$RELEASE_TAG.vsix" --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      # Marketplace validation runs asynchronously after upload; don't hold the job open waiting for it.
      - name: Publish the release artifact to Visual Studio Marketplace
        run: tfx extension publish --vsix "dist/authenticated-scripts-$RELEASE_TAG.vsix" --auth-type pat --token "$PUBLISH_TOKEN" --no-wait-validation
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
