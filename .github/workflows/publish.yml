name: Publish release to Azure DevOps Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain
        with:
          cache: ''
          install-tfx: 'true'

      - name: Download the published release VSIX
        run: gh release download "$RELEASE_TAG" --pattern authenticated-scripts.vsix --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Publish the release artifact to Visual Studio Marketplace
        run: tfx extension publish --vsix dist/authenticated-scripts.vsix --auth-type pat --token "$PUBLISH_TOKEN"
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
