name: Test, package, and draft release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pushes to main share one queue from testing through draft creation; pull requests queue per PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pull-request-{0}', github.event.pull_request.number) || 'draft-release' }}
  cancel-in-progress: false
  queue: max

# Verifiable-build controls: the runtime, package manager, and dependency graph are pinned and packaging is
# deterministic, so anyone can rebuild a release and compare its SHA-256. CI attests the VSIX it drafts.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - run: npm ci

      - name: Patch source versions before building
        run: npm run patch:task
        env:
          GH_TOKEN: ${{ github.token }}

      # Builds, then runs the tests, writing build/test-results/<platform>-<arch>.xml.
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results/

  test-results:
    name: Publish test results
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results

      # Writes the job summary on every run; comments only on pull requests.
      - uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/**/*.xml
          comment_mode: ${{ github.event_name == 'pull_request' && 'always' || 'off' }}

  draft-release:
    needs: test
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestation: OIDC token for Sigstore signing, then persist the attestation.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - run: npm ci

      - name: Patch source versions before building
        run: npm run patch:task
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npm run package

      - name: Read the patched version
        id: version
        run: echo "version=$(node -p "require('./vss-extension.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance for the VSIX
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/authenticated-scripts-v${{ steps.version.outputs.version }}.vsix

      # Ship the Sigstore bundle with the release so the VSIX can also be verified offline.
      - name: Collect release assets
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/authenticated-scripts-v$VERSION.vsix.sigstore.json"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: authenticated-scripts-vsix
          path: dist/authenticated-scripts-v${{ steps.version.outputs.version }}.vsix*

      - name: Replace the draft release with the tested VSIX
        run: |
          if IS_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq .isDraft); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release v$VERSION is published; refusing to delete it." >&2
              exit 1
            fi
            gh release delete "v$VERSION" --yes
          fi
          # A release that was published and then deleted leaves its tag behind. 
          # GitHub ignores --target when the tag already exists, so remove it for the draft to target this commit.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "Deleting leftover tag v$VERSION."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" --silent
          fi
          gh release create "v$VERSION" \
            "dist/authenticated-scripts-v$VERSION.vsix" \
            "dist/authenticated-scripts-v$VERSION.vsix.sigstore.json" \
            --draft --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
